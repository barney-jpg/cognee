name: build | Publish dev images to GHCR

# On every merge to `develop`, build the Docker images and publish them to GitHub Container
# Registry so the current development build is pullable as ghcr.io/<owner>/cognee:develop and
# ghcr.io/<owner>/cognee-mcp:develop (plus immutable develop-<sha> tags). Authenticates with the
# built-in GITHUB_TOKEN (packages: write) — no extra secrets. Docker Hub publishing on `main`
# (dockerhub.yml / dockerhub-mcp.yml) is unaffected. See issue pajoma/cognee#5.

on:
  push:
    branches: [develop, feature/ghcr-develop-images]
  workflow_dispatch: {}

concurrency:
  group: ghcr-develop
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cognee
            dockerfile: Dockerfile
          - image: cognee-mcp
            dockerfile: cognee-mcp/Dockerfile
    steps:
      - name: Free disk space before build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          docker system prune -af || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # `develop` is a moving tag; `develop-<sha>` is immutable. No `latest` — that is
          # reserved for main/releases so it never points at an unreleased dev build.
          tags: |
            type=raw,value=develop
            type=sha,prefix=develop-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Image digest
        run: echo "${{ matrix.image }}@${{ steps.build.outputs.digest }}"
